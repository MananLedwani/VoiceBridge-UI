<div class="add-clerk">
    <p-button icon="pi pi-plus" pTooltip="Add Clerk"></p-button>
</div>
<div class="clerk-table">
  <p-table
    stripedRows
    [value]="clerks"
    [paginator]="true"
    [rows]="5"
    [tableStyle]="{ 'min-width': '50rem' }"
    [rowsPerPageOptions]="[5, 10, 20]"
  >
    <ng-template #header>
      <tr>
        <th style="width: 33%">Name</th>
        <th style="width: 33%">Email</th>
        <th style="width: 33%">Mobile</th>
      </tr>
    </ng-template>
    <ng-template #body let-clerk>
      <tr>
        <td>{{ clerk.username }}</td>
        <td>{{ clerk.email }}</td>
        <td>{{ clerk.mobile }}</td>
      </tr>
    </ng-template>
  </p-table>
</div>
