<div class="stt-container">

  <div class="stt-box">
    <h2>Speech to Text</h2>

    <div class="upload-section">
      <label class="file-label">Upload Audio File (Max 5MB):</label>
      <input
        type="file"
        (change)="onFileSelected($event)"
        accept=".wav, .mp3, .flac"
        class="file-input"
      />
      <small class="hint">Supported formats: .wav, .mp3, .flac</small>
    </div>

    @if(selectedFile){
      <p class="file-name">
        Selected: <strong>{{ selectedFile.name }}</strong>
      </p>
    }

    <div class="language-row">
      <label>Select Audio Language:</label>
      <select [(ngModel)]="selectedLanguage">
        <option value="hi">Hindi</option>
        <option value="sa">Sanskrit</option>
      </select>
    </div>

    @if(errorMessage){
      <div class="error-msg">
        {{ errorMessage }}
      </div>
    }

    <button (click)="convert()" [disabled]="!selectedFile || isLoading()" class="convert-btn">
      @if(isLoading()){
        Processing...
      }@else{
        Convert to Text
      }
    </button>

    <div class="output-section">
      <h3>Transcribed Text</h3>
      <textarea 
        readonly 
        [value]="transcribedText"
        placeholder="Transcription will appear here..."
      ></textarea>
    </div>
  </div>

</div>

@if(isLoading()){
  <app-loader></app-loader>
}

<p-toast/>
