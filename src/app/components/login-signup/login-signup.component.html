<div class="container">
  <div class="image"></div>

  <div class="login-form">
    <div class="heading">
      <h1>Login</h1>
      <br />
      <h5>Manage your Inventory with Inventra!!</h5>
      <div class="form-container">
          <form #loginForm="ngForm" (ngSubmit)="onLogin(loginForm)" novalidate>
            <div class="form-group">
              <label>Email <span class="star">*</span></label>
              <input
                type="email"
                name="email"
                [(ngModel)]="loginDetails.email"
                required
                email
                #email="ngModel"
              />
              <div
                class="error"
                *ngIf="email.invalid && (email.dirty || email.touched)"
              >
                <small *ngIf="email.errors?.['required']">Email is required.</small>
                <small *ngIf="email.errors?.['email']"
                  >Enter a valid email address.</small
                >
              </div>
            </div>
            <br><br>
            <div class="form-group">
              <label>Password <span class="star">*</span></label>
              <input
                type="password"
                name="password"
                [(ngModel)]="loginDetails.password"
                required
                #password="ngModel"
              />
              <div
                class="error"
                *ngIf="password.invalid && (password.dirty || password.touched)"
              >
                @if (password.invalid && (password.dirty || password.touched)) { @if
                (password.errors?.['required']) {
                <small>Password is required.</small>
                }}
              </div>
            </div>
            <br><br>
            <button class="login-button" [disabled]="loginForm.invalid">Login</button>
          </form>
      </div>
    </div>
  </div>
</div>
